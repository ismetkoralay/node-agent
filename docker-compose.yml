services:
  postgres:
    image: postgres:17-alpine
    environment:
      - "POSTGRES_USER=${POSTGRES_USER:-nodeagent}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-12345678}"
      - "POSTGRES_DB=${POSTGRES_DB:-nodeagent}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodeagent}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  ollama:
    image: ollama/ollama:0.40.13
    container_name: ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.40.13
    profiles:
      - ollama
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull qwen2.5:7b"

volumes:
  postgres-data:
  ollama_data: {}